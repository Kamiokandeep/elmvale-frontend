<!-- Hero Section -->
<div class="hero-section">
    <div class="hero-image" [ngStyle]="{'background-image': 'url(' + homeContent?.heroImage + ')'}"></div>
    <div class="hero-content container text-center text-white">
        <h1 class="display-1 fw-bold">{{ homeContent?.heroTitle }}</h1>
    </div>
</div>

<div class="container">
    <!-- Welcome Section -->
    <div class="container-fluid py-5 bg-white">
        <div class="row justify-content-center">
            <div class="col-12 text-center">
                <h1 class="display-4 fw-bold" style="color: #115D5A;">{{ homeContent?.welcomeTitle }}</h1>
                <div class="divider mx-auto"
                    style="height: 3px; width: 80px; background-color: #115D5A; margin: 1rem auto;"></div>
            </div>
        </div>
    </div>

    <!-- Our Mission Section -->
    <div class="container-fluid py-5 bg-white">
        <div class="row align-items-center">
            <div class="col-md-6 mb-4 mb-md-0">
                <img [src]="homeContent?.missionImage" alt="Community Gardening" class="img-fluid rounded shadow-lg"
                    style="max-height: 500px; width: 100%; object-fit: cover;">
            </div>
            <div class="col-md-6">
                <div class="px-4">
                    <h2 class="mb-4" style="color: #115D5A;">{{ homeContent?.missionTitle }}</h2>
                    <div class="divider mb-4" style="height: 3px; width: 80px; background-color: #115D5A;"></div>
                    <p class="lead">{{ homeContent?.missionDescription }}</p>
                    <p>{{ homeContent?.missionParagraph1 }}</p>
                    <p>{{ homeContent?.missionParagraph2 }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
