<div class="container">

    <!-- Education Section -->
    <div class="education-section" style="background-color: #115D5A;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card shadow-lg position-relative"
                        style="border: none; border-radius: 10px; overflow: visible;">
                        <div class="row g-0">

                            <!-- Main Image -->
                            <div class="col-md-6">
                                <img [src]="content.imageUrl" alt="Education Speaker" class="img-fluid h-100 w-100"
                                    style="object-fit: cover; border-top-left-radius: 10px; border-bottom-left-radius: 10px;">
                            </div>

                            <!-- Content -->
                            <div class="col-md-6 p-4 bg-white d-flex flex-column"
                                style="border-top-right-radius: 10px; border-bottom-right-radius: 10px;">
                                <div class="p-4">
                                    <h2 class="display-5 fw-bold mb-2" style="color: #115D5A;">{{ content.title }}</h2>
                                    <div class="divider mb-3"
                                        style="height: 3px; width: 80px; background-color: #115D5A; opacity: 0.5;">
                                    </div>
                                </div>

                                <div class="position-relative mt-auto" style="min-height: 180px;">
                                    <div class="p-4"
                                        style="background-color: rgba(17, 93, 90, 0.1); border-radius: 8px; border: 2px solid #115D5A;">
                                        <p class="text-dark fs-3 mb-0">{{ content.content }}</p>
                                    </div>

                                    <div class="position-absolute" style="top: -60px; right: -90px; z-index: 10;">
                                        <img [src]="content.imageUrlDecoration" alt="Trillium Flower" class="img-fluid"
                                            style="max-height: 120px; width: auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));">
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bursary Section -->
    <div class="container-fluid py-5 bg-white">
        <div class="row justify-content-center">

            <!-- Text Section -->
            <div class="col-md-6 p-1">
                <h3 class="fs-3 fw-bold mb-3" style="color: #115D5A;">{{ content.additionalTitle }}</h3>

                <div *ngFor="let item of content.bursaryItems" class="bursary-item mb-4">
                    <div class="d-flex align-items-start mb-3">
                        <i class="{{ item.icon }} me-3 fs-4" style="color: #115D5A;"></i>
                        <div>
                            <h3 class="fs-5 fw-bold mb-1" style="color: #115D5A;">{{ item.title }}</h3>
                            <p class="mb-0">{{ item.description }}</p>
                        </div>
                    </div>
                </div>

                <!-- Optional More Info -->
                <div *ngIf="content.additionalLinkText && content.additionalLinkUrl" class="mt-4">
                    <div class="d-flex align-items-start">
                        <i class="{{ content.additionalLinkIcon }} me-3 fs-4" style="color: #115D5A;"></i>
                        <p class="mb-0">
                            {{ content.additionalLinkText }}:
                            <a [href]="content.additionalLinkUrl" target="_blank"
                                style="color: #115D5A; text-decoration: underline;">
                                {{ content.additionalLinkUrl }}
                            </a>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Side Image -->
            <div class="col-md-6">
                <img [src]="content.sideImageUrl" alt="Speaker at E.D.G.E. Event" class="img-fluid rounded shadow-lg"
                    style="max-height: 600px; width: 100%; object-fit: cover;">
            </div>
        </div>
    </div>
</div>
