<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup</title>
</head>
<body>
  <form>
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="inputFirstName">First name</label>
        <input type="text" class="form-control" id="inputFirstnamr" placeholder="First Name">
      </div>
      <div class="form-group col-md-6">
        <label for="inputLastName">Last name</label>
        <input type="text" class="form-control" id="inputFirstnamr" placeholder="Last Name">
      </div>
      <div class="form-group col-md-6">
        <label for="inputEmail4">Email</label>
        <input type="email" class="form-control" id="inputEmail4" placeholder="Email">
      </div>
      <div class="form-group col-md-6">
        <label for="inputPassword4">Password</label>
        <input type="password" class="form-control" id="inputPassword4" placeholder="Password">
      </div>
    </div>
    <div class="form-group">
      <label for="inputAddress">Address</label>
      <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
    </div>
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="inputCity">City</label>
        <input type="text" class="form-control" id="inputCity">
      </div>
      <div class="form-group col-md-2">
        <label for="inputPC">Postal Code</label>
        <input type="text" class="form-control" id="inputPC">
      </div>
    </div>
    <div class="form-group">
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>

</body>
</html>
