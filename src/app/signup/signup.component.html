<div class="container">
    <div class="container py-5 d-flex justify-content-center">
        <div class="card shadow-lg p-4 rounded-4" style="max-width: 500px; width: 100%;">
            <h2 class="mb-4 text-center">Register</h2>
            <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control rounded-3" id="email" formControlName="email"
                        placeholder="Email">
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control rounded-3" id="password" formControlName="password"
                        placeholder="Password">
                </div>

                <div *ngIf="error" class="alert alert-danger py-2">
                    {{ error }}
                </div>

                <button type="submit" class="btn btn-success w-100 rounded-3 py-2" [disabled]="signupForm.invalid">Sign
                    Up</button>
            </form>
        </div>
    </div>
</div>
