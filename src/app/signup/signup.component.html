<div class="container">
    <div class="container py-5 d-flex justify-content-center">
        <div class="card shadow-lg p-4 rounded-4" style="max-width: 700px; width: 100%;">
            <h2 class="mb-4 text-center">Register</h2>
            <form>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="inputFirstName" class="form-label">First Name</label>
                        <input type="text" class="form-control rounded-3" id="inputFirstName" placeholder="First Name">
                    </div>
                    <div class="col-md-6">
                        <label for="inputLastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control rounded-3" id="inputLastName" placeholder="Last Name">
                    </div>
                    <div class="col-md-6">
                        <label for="inputEmail4" class="form-label">Email</label>
                        <input type="email" class="form-control rounded-3" id="inputEmail4" placeholder="Email">
                    </div>
                    <div class="col-md-6">
                        <label for="inputPassword4" class="form-label">Password</label>
                        <input type="password" class="form-control rounded-3" id="inputPassword4"
                            placeholder="Password">
                    </div>
                    <div class="col-12">
                        <label for="inputAddress" class="form-label">Address</label>
                        <input type="text" class="form-control rounded-3" id="inputAddress" placeholder="1234 Main St">
                    </div>
                    <div class="col-md-6">
                        <label for="inputCity" class="form-label">City</label>
                        <input type="text" class="form-control rounded-3" id="inputCity">
                    </div>
                    <div class="col-md-6">
                        <label for="inputPC" class="form-label">Postal Code</label>
                        <input type="text" class="form-control rounded-3" id="inputPC">
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-success w-100 rounded-3 py-2 mt-3">Sign Up</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

</div>
