<div class="container">

    <!-- Section 1 -->
    <div class="position-relative" style="height: 400px;">
        <img [src]="content?.heroImage" alt="Gardening Resources" class="w-100 h-100 object-fit-cover">
        <div class="position-absolute top-50 start-50 translate-middle text-white text-center">
            <h1 class="display-3 fw-bold" style="text-shadow: 2px 2px 8px rgba(0,0,0,0.6);">
                {{ content?.heroTitle }}
            </h1>
        </div>
    </div>

    <!-- Section 2 -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <p class="text-center fs-4 fw-semibold" style="color: #115D5A;">
                    {{ content?.introText }}
                </p>
            </div>
        </div>
    </div>

    <!-- Section 3 -->
    <div class="container py-5">
        <div class="row justify-content-center g-4">
            <div class="col-md-4" *ngFor="let card of content?.cards">
                <div class="flip-card">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img [src]="card.image" class="w-100 h-100 object-fit-cover rounded" [alt]="card.title">
                            <h5 class="position-absolute bottom-0 w-100 text-center text-white p-2"
                                style="background-color: rgba(0, 0, 0, 0.6);">{{ card.title }}</h5>
                        </div>
                        <div class="flip-card-back d-flex align-items-center justify-content-center p-3">
                            <p class="text-white text-center">{{ card.description }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Section 4 -->
    <div class="container py-5">
        <h2 class="text-center mb-4 fw-bold" style="color: #115D5A;">
            {{ content?.sectionTitle }}
        </h2>
        <p class="text-center fs-5">
            {{ content?.sectionDescription }}
        </p>
        <div class="col-lg-8 mx-auto">
            <ul class="list-unstyled fs-5 mt-4" style="color: #115D5A;">
                <li *ngFor="let item of content?.sectionList" class="mb-3">
                    {{ item.icon }} <strong>{{ item.title }}:</strong> {{ item.content }}
                </li>
            </ul>
        </div>
    </div>
</div>
