<div class="container my-5" *ngIf="content">
    <h2 class="text-center mb-3">{{ content.heroTitle }}</h2>
    <p class="text-center mb-5">{{ content.heroText }}</p>

    <div class="row g-4 align-items-start">
        <!-- Contact Form -->
        <div class="col-lg-7">
            <div class="card rounded-4 p-4">
                <h4 class="mb-4">Send Us a Message</h4>
                <form [formGroup]="contactForm" (ngSubmit)="submitForm()">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input formControlName="fullName" type="text" class="form-control" placeholder="Enter your name"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input formControlName="email" type="email" class="form-control" placeholder="Enter your email"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input formControlName="phone" type="text" class="form-control"
                            placeholder="Enter your phone number" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Subject</label>
                        <div class="row row-cols-1 row-cols-sm-2">
                            <div class="form-check"
                                *ngFor="let s of ['General Inquiry', 'Membership Information', 'Event Details', 'Photo Contest Submission', 'Gardening Advice', 'Other']">
                                <input class="form-check-input" type="radio" formControlName="subject" [value]="s"
                                    [id]="s">
                                <label class="form-check-label" [for]="s">{{ s }}</label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea formControlName="message" class="form-control" rows="4"
                            placeholder="Enter your message" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Preferred Contact Method</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" formControlName="preferredMethod" value="Email"
                                id="emailContact" required>
                            <label class="form-check-label" for="emailContact">Email</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" formControlName="preferredMethod" value="Phone"
                                id="phoneContact">
                            <label class="form-check-label" for="phoneContact">Phone</label>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input type="checkbox" class="form-check-input" formControlName="consent" id="consent" required>
                        <label class="form-check-label" for="consent">
                            I agree to be contacted by Elmvale District Garden Enthusiasts.
                        </label>
                    </div>

                    <button type="submit" class="btn btn-outline-success" [disabled]="!contactForm.valid">Send
                        Message</button>
                </form>
            </div>
        </div>

        <!-- Image -->
        <div class="col-lg-5">
            <div class="card shadow rounded-4 overflow-hidden mb-4">
                <img [src]="content.image || '/placeholder.jpg'" alt="Workshop" class="img-fluid w-100"
                    style="object-fit: cover; height: 450px;">
            </div>
            <!-- Info -->
            <div class="p-4">
                <hr />
                <p><strong>Email: </strong> <a [href]="'mailto:' + content.email">{{ content.email }}</a></p>
                <p><strong>Phone: </strong> {{ content.phone }}</p>
                <p><strong>Meeting Location: </strong></p>
                <p [innerHTML]="content.location"></p>
                <p>{{ content.meetingDetails }}</p>
                <hr />
            </div>
        </div>
    </div>
</div>
