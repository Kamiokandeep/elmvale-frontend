<div class="container">

  <!-- Section 1 -->
  <div class="position-relative" style="height: 400px;">
    <img [src]="content.heroImage" alt="Photo Gallery" class="w-100 h-100 object-fit-cover">
    <div class="position-absolute top-50 start-50 translate-middle text-white text-center">
      <h1 class="display-3 fw-bold" style="text-shadow: 2px 2px 8px rgba(0,0,0,0.6);">
        {{ content.heroTitle }}
      </h1>
    </div>
  </div>

  <!-- Section 2 -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <p class="text-center fs-4 fw-semibold" style="color: #115D5A;">
          {{ content.introText }}
        </p>
      </div>
    </div>
  </div>

  <!-- Section 3 - Albums -->
  <div class="container py-1">
    <div class="row g-4 justify-content-center">

      <div *ngFor="let album of content.albums; let i = index" class="col-md-4">
        <div class="card shadow-sm rounded overflow-hidden">
          <div [id]="'carouselAlbum' + i" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
              <div *ngFor="let image of album.images; let j = index" [class]="'carousel-item' + (j === 0 ? ' active' : '')">
                <img [src]="image" class="d-block w-100 object-fit-cover" [alt]="'Album ' + (i + 1)">
              </div>
            </div>
            <button class="carousel-control-prev" type="button" [attr.data-bs-target]="'#carouselAlbum' + i" data-bs-slide="prev">
              <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" [attr.data-bs-target]="'#carouselAlbum' + i" data-bs-slide="next">
              <span class="carousel-control-next-icon"></span>
            </button>
          </div>
          <div class="card-body text-center bg-light">
            <h5 class="card-title mb-0 fw-bold" style="color: #115D5A;">{{ album.title }}</h5>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Section 4 -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-10 text-center">
        <h2 class="fw-bold mb-4" style="color: #115D5A;">{{ content.sectionTitle }}</h2>
        <p class="fs-5">
          {{ content.sectionDescription }}
        </p>
      </div>
    </div>

    <!-- Section 5 - Winners -->
    <div class="row g-4 justify-content-center mt-4">
      <div *ngFor="let winner of content.winners; let i = index" class="col-md-4">
        <div class="card shadow-sm rounded overflow-hidden">
          <div [id]="'carouselWinner' + i" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
              <div *ngFor="let image of winner.images; let j = index" [class]="'carousel-item' + (j === 0 ? ' active' : '')">
                <img [src]="image" class="d-block w-100 object-fit-cover" [alt]="'Winner ' + (i + 1)">
              </div>
            </div>
            <button class="carousel-control-prev" type="button" [attr.data-bs-target]="'#carouselWinner' + i" data-bs-slide="prev">
              <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" [attr.data-bs-target]="'#carouselWinner' + i" data-bs-slide="next">
              <span class="carousel-control-next-icon"></span>
            </button>
          </div>
          <div class="card-body text-center bg-light">
            <h5 class="card-title mb-0 fw-bold" style="color: #115D5A;">{{ winner.title }}</h5>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
