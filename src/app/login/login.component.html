<div class="container">
    <div class="container py-5 d-flex justify-content-center">
        <div class="card shadow-lg p-4 rounded-4" style="max-width: 500px; width: 100%;">
            <h2 class="mb-4 text-center">Sign In</h2>
            <form >
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Email address</label>
                    <input formControlName="email" type="email" class="form-control rounded-3" id="exampleInputEmail1"
                        placeholder="Enter your email" />
                    <div class="form-text text-muted">We'll never share your email with anyone else.</div>
                </div>

                <div class="mb-4">
                    <label for="exampleInputPassword1" class="form-label">Password</label>
                    <input formControlName="password" [type]="type" class="form-control rounded-3" id="exampleInputPassword1"
                        placeholder="Enter your password" />
                        <span (click)="hideShowPass()" class="fa{eyeIcon}"></span>
                </div>

                <div class="mb-4">
                  <a id="forgot" class="font-weight=bold">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-success w-100 rounded-3 py-2"(click)="onloginIn()">Sign In</button>
                <div class="text-center pt-4 text-muted">Don't have account?<a id="forgot" routerLink="/signup">Sign Up</a></div>
            </form>
        </div>
    </div>
</div>
