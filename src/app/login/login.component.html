<div class="container">
    <div class="container py-5 d-flex justify-content-center">
        <div class="card shadow-lg p-4 rounded-4" style="max-width: 500px; width: 100%;">
            <h2 class="mb-4 text-center">Sign In</h2>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" id="email" class="form-control rounded-3" formControlName="email"
                        placeholder="Enter your email" />
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control rounded-3" formControlName="password"
                        placeholder="Enter your password" />
                </div>

                <div *ngIf="error" class="alert alert-danger py-2">
                    {{ error }}
                </div>

                <button type="submit" class="btn btn-success w-100 rounded-3 py-2" [disabled]="loginForm.invalid">Sign
                    In</button>
            </form>
        </div>
    </div>
</div>
